<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#88C0D0"/>
    </marker>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E81AC"/>
      <stop offset="1" stop-color="#4C6A92"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A3BE8C"/>
      <stop offset="1" stop-color="#8FAA78"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1000" height="460" rx="18" fill="#242933"/>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#88C0D0" letter-spacing="1.5" text-anchor="middle">
    <text x="130" y="48">TRIGGERS</text>
    <text x="450" y="48">BACKGROUND SERVICE WORKER</text>
    <text x="820" y="48">EVERY WEB PAGE</text>
  </g>

  <!-- panels -->
  <g fill="#2E3440" stroke="#434C5E" stroke-width="1.5">
    <rect x="30" y="66" width="200" height="364" rx="14"/>
    <rect x="290" y="66" width="320" height="364" rx="14"/>
    <rect x="670" y="66" width="300" height="364" rx="14"/>
  </g>

  <!-- triggers -->
  <g font-size="14" font-weight="600" fill="#ECEFF4">
    <g>
      <rect x="50" y="94" width="160" height="58" rx="10" fill="#3B4252" stroke="#4C566A"/>
      <circle cx="72" cy="123" r="5" fill="#A3BE8C"/>
      <text x="86" y="128">Browser startup</text>
    </g>
    <g>
      <rect x="50" y="176" width="160" height="58" rx="10" fill="#3B4252" stroke="#4C566A"/>
      <circle cx="72" cy="205" r="5" fill="#A3BE8C"/>
      <text x="86" y="210">Periodic check</text>
    </g>
    <g>
      <rect x="50" y="258" width="160" height="58" rx="10" fill="#3B4252" stroke="#4C566A"/>
      <circle cx="72" cy="287" r="5" fill="#EBCB8B"/>
      <text x="86" y="283">VPN / network</text>
      <text x="86" y="301" font-size="12" font-weight="400" fill="#9AA5B8">change detected</text>
    </g>
    <g>
      <rect x="50" y="340" width="160" height="58" rx="10" fill="#3B4252" stroke="#4C566A"/>
      <circle cx="72" cy="369" r="5" fill="#B48EAD"/>
      <text x="86" y="365">Popup</text>
      <text x="86" y="383" font-size="12" font-weight="400" fill="#9AA5B8">"Re-check IP"</text>
    </g>
  </g>

  <!-- background steps -->
  <g text-anchor="middle" fill="#ECEFF4">
    <rect x="315" y="94" width="270" height="84" rx="12" fill="url(#step)" stroke="#81A1C1"/>
    <text x="450" y="128" font-size="16" font-weight="700">1 · Get public IP</text>
    <text x="450" y="152" font-size="12.5" fill="#D8DEE9">ipify · Cloudflare · icanhazip</text>

    <rect x="315" y="206" width="270" height="84" rx="12" fill="url(#step)" stroke="#81A1C1"/>
    <text x="450" y="240" font-size="16" font-weight="700">2 · Resolve time zone</text>
    <text x="450" y="264" font-size="12.5" fill="#D8DEE9">ipwho.is · geojs.io · ipapi.co · freeipapi</text>

    <rect x="315" y="318" width="270" height="84" rx="12" fill="url(#step)" stroke="#81A1C1"/>
    <text x="450" y="352" font-size="16" font-weight="700">3 · Publish active zone</text>
    <text x="450" y="376" font-size="12.5" fill="#D8DEE9">content scripts + storage</text>
  </g>

  <!-- page steps -->
  <g text-anchor="middle" fill="#ECEFF4">
    <rect x="695" y="94" width="250" height="84" rx="12" fill="#434C5E" stroke="#88C0D0"/>
    <text x="820" y="128" font-size="16" font-weight="700">relay.js</text>
    <text x="820" y="152" font-size="12.5" fill="#D8DEE9">isolated world · knows the zone</text>

    <rect x="695" y="206" width="250" height="84" rx="12" fill="#434C5E" stroke="#88C0D0"/>
    <text x="820" y="240" font-size="16" font-weight="700">4 · inject.js</text>
    <text x="820" y="264" font-size="12.5" fill="#D8DEE9">page world · patches time APIs</text>

    <rect x="695" y="318" width="250" height="84" rx="12" fill="url(#result)" stroke="#A3BE8C"/>
    <text x="820" y="352" font-size="16" font-weight="700" fill="#2E3440">Website sees VPN zone</text>
    <text x="820" y="376" font-size="12.5" fill="#3B4252">Date · Intl · Temporal · iframes</text>
  </g>

  <!-- arrows -->
  <g stroke="#88C0D0" stroke-width="2.5" fill="none" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M232 248H260V136H311"/>
    <path d="M450 180V202"/>
    <path d="M450 292V314"/>
    <path d="M587 360H640V136H691"/>
    <path d="M820 180V202"/>
    <path d="M820 292V314"/>
  </g>
  <g font-size="11.5" fill="#9AA5B8">
    <rect x="618" y="236" width="44" height="22" rx="6" fill="#242933" stroke="#434C5E"/>
    <text x="640" y="251" text-anchor="middle" fill="#ECEFF4" font-weight="600">zone</text>
    <text x="832" y="195">sync · document_start</text>
  </g>
</svg>
